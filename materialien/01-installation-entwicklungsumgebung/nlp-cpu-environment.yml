name: nlp-cpu

# Windows-11-CPU-Umgebung für PyTorch 2.11.0.
#
# Wichtige Stabilitätsmaßnahme:
# NumPy, SciPy und weitere BLAS-Nutzer werden ausdrücklich an die
# pthreads-Variante von OpenBLAS gebunden. Dadurch wird verhindert,
# dass Conda später automatisch auf MKL und dessen libiomp5md.dll
# wechselt, während der PyTorch-Wheel eine eigene OpenMP-Laufzeit
# verwendet.
#
# Die Datei vermeidet außerdem eine Mischung aus defaults und
# conda-forge durch nodefaults.

channels:
  - conda-forge
  - nodefaults

dependencies:
  # ============================================================
  # 1) Python und Paketverwaltung
  # ============================================================
  - python=3.13
  - pip
  - pyyaml

  # ============================================================
  # 2) BLAS- und OpenMP-Stabilität unter Windows
  # ============================================================
  # OpenBLAS statt MKL verwenden.
  - "libblas=*=*_openblas"
  - "libcblas=*=*_openblas"
  - "liblapack=*=*_openblas"

  # Die pthreads-Variante verwendet für BLAS kein OpenMP.
  - "libopenblas=*=pthreads_*"

  # ============================================================
  # 3) Wissenschaftlicher Kern
  # ============================================================
  - numpy=2.4.6
  - numba=0.65.1
  - scipy=1.18.0
  - pandas=3.0.3
  - statsmodels
  - scikit-learn=1.9.0
  - joblib

  # ============================================================
  # 4) Visualisierung
  # ============================================================
  - matplotlib=3.11.0
  - seaborn
  - plotly
  - folium

  # ============================================================
  # 5) Datenimport, Dateiformate und große Datenmengen
  # ============================================================
  - openpyxl
  - pdfplumber
  - pypdf
  - python-docx
  - pyarrow
  - pyreadr
  - dask
  - distributed

  # ============================================================
  # 6) Bild- und Medienverarbeitung
  # ============================================================
  - pillow
  - pytesseract
  - tesseract
  - ffmpeg

  # ============================================================
  # 7) Natural Language Processing
  # ============================================================
  - nltk=3.9.*
  - spacy=3.8.14

  - spacy-model-de_core_news_sm=3.8.0
  - spacy-model-de_core_news_md=3.8.0
  - spacy-model-en_core_web_sm=3.8.0
  - spacy-model-en_core_web_md=3.8.0

  # ============================================================
  # 8) Spyder-Anbindung
  # ============================================================
  - "spyder-kernels>=3.1,<3.2"

  # ============================================================
  # 9) Hilfsprogramme und Systeminformationen
  # ============================================================
  - py-cpuinfo
  - psutil
  - tqdm
  - filelock
  - typing_extensions
  - sympy
  - networkx
  - jinja2
  - fsspec
  - graphviz
  - python-graphviz

  # ============================================================
  # 10) Web-API und Tests
  # ============================================================
  - fastapi
  - uvicorn
  - pytest

  # ============================================================
  # 11) Windows-Oberfläche und Programmbereitstellung
  # ============================================================
  - tk
  - pyinstaller

  # ============================================================
  # 12) PyTorch-CPU-Stack und Zusatzpakete
  # ============================================================
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - --extra-index-url https://pypi.org/simple

      # TestClient-Unterstützung für FastAPI/Starlette.
      - httpx2

      # Model Context Protocol (MCP)
      - mcp==2.2.0

      - torch==2.11.0+cpu
      - torchvision==0.26.0+cpu
      - torchaudio==2.11.0+cpu

      - timm==1.0.28
      - torchviz==0.0.3

      # Trainingsverläufe aus PyTorch visualisieren.
      - tensorboard==2.21.0

      - transformers==5.13.1
      - huggingface-hub==1.33.0
      - sentence-transformers==5.6.0
      - sentencepiece==0.2.1
      - tokenizers
      - datasets
      - evaluate==0.4.6
      - accelerate
      - peft
      - safetensors
      - openai==3.19.0

      # fastText-kompatibler Windows-Build für Python 3.13.
      - fasttext-community==0.11.7

      - faiss-cpu
      - spacy-lookups-data
      - beautifulsoup4
      - lxml
      - regex
      - charset-normalizer
      - rapidfuzz

      - sacrebleu
      - rouge-score
      - seqeval
      - jiwer
      - python-dotenv

      - openai-whisper==20250625
      - PyAudio==0.2.14
      - pyttsx3
